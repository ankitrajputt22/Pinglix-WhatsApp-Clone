spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${PINGLIX_DB_URL:jdbc:mysql://localhost:3306/pinglix?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${PINGLIX_DB_USERNAME:pinglix}
    password: ${PINGLIX_DB_PASSWORD:pinglix_dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true

pinglix:
  cors:
    allowed-origins: ${PINGLIX_CORS_ALLOWED_ORIGINS:http://localhost:5174}

  security:
    jwt-secret: ${PINGLIX_JWT_SECRET:pinglix-local-development-secret-change-before-production-2026}
    access-token-ttl: ${PINGLIX_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${PINGLIX_REFRESH_TOKEN_TTL:30d}
    access-cookie-name: pinglix_access
    refresh-cookie-name: pinglix_refresh
    secure-cookie: false
    same-site: Lax