name: pinglix

services:
  mysql:
    image: mysql:8.4.10
    container_name: pinglix-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pinglix}
      MYSQL_USER: ${PINGLIX_DB_USERNAME:-pinglix}
      MYSQL_PASSWORD: ${PINGLIX_DB_PASSWORD:-pinglix_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pinglix_root_dev_password}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - pinglix_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pinglix_mysql_data:
    name: pinglix_mysql_data
