name: pinglix-prod-example

# This file is an example for a production-style local build.
# Put real values in an ignored infrastructure/.env file before using it.

services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pinglix}
      MYSQL_USER: ${PINGLIX_DB_USERNAME:-replace-with-db-user}
      MYSQL_PASSWORD: ${PINGLIX_DB_PASSWORD:-replace-with-db-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-replace-with-root-password}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - pinglix_prod_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pinglix?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${PINGLIX_DB_USERNAME:-replace-with-db-user}
      SPRING_DATASOURCE_PASSWORD: ${PINGLIX_DB_PASSWORD:-replace-with-db-password}
      PINGLIX_JWT_SECRET: ${PINGLIX_JWT_SECRET:-replace-with-a-random-secret-of-at-least-32-characters}
      PINGLIX_CORS_ALLOWED_ORIGINS: ${PINGLIX_CORS_ALLOWED_ORIGINS:-http://localhost:5174}
      PINGLIX_COOKIE_SECURE: ${PINGLIX_COOKIE_SECURE:-true}
      PINGLIX_COOKIE_SAME_SITE: ${PINGLIX_COOKIE_SAME_SITE:-Lax}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080/ws}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend

volumes:
  pinglix_prod_mysql_data:
